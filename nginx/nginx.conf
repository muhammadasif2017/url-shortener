# Reverse proxy for the multi-instance experiments.
#
# This file is not a production configuration and does not claim to be. It
# exists to put a real proxy in front of two real instances, so the failure
# modes recorded in docs/adr/0005-single-process-no-load-balancer.md can be
# caused deliberately rather than reasoned about.
#
# Read docs/multi-instance.md for what each setting here is being used to prove.

events {
    worker_connections 1024;
}

http {
    # Access logs carry the address nginx saw and the address it forwarded, so a
    # disagreement between what the proxy knows and what the service records is
    # visible in one place rather than inferred.
    log_format experiment '$remote_addr -> $upstream_addr '
                          'xff="$proxy_add_x_forwarded_for" '
                          '"$request" $status';
    access_log /dev/stdout experiment;
    error_log /dev/stderr warn;

    upstream app {
        # Round robin, the default, and deliberately not ip_hash. Sticky routing
        # would hide exactly what these experiments are for: two instances
        # holding two different answers. Round robin sends consecutive requests
        # from one client to different instances, which is what makes a
        # per-instance counter visibly per-instance.
        server app1:3000;
        server app2:3000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://app;

            # The header the service reads to recover the client address. nginx
            # appends the address it saw to whatever the client sent, which is
            # why the service must count trusted hops from the right rather than
            # trusting the leftmost entry. A client that sends its own
            # X-Forwarded-For does not get to choose its identity; it only gets
            # to prepend noise.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;

            # Do not follow a redirect on the caller's behalf, and do not rewrite
            # its Location. The redirect is the product under test.
            proxy_redirect off;

            # Short, so an experiment that kills an instance reports quickly
            # rather than appearing to hang.
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;

            # When an instance is being drained, retry the next one. Without
            # this, the graceful-shutdown experiment cannot distinguish "the
            # request was dropped" from "nginx gave up on a healthy instance".
            #
            # `http_503` is deliberately NOT in this list, and that was a bug
            # here first. This service uses 503 as a real answer in two places:
            # readiness reporting that the database is unreachable, and the rate
            # limiter failing closed. Retrying those does two harmful things. It
            # replaces an honest 503 with a synthesized 502, so a load balancer
            # reading readiness learns the wrong thing about the instance. And
            # it doubles the load of every failing request at the moment the
            # dependency is already struggling, which is precisely when a
            # fail-closed limiter is trying to shed load.
            #
            # Retry only what indicates the instance itself is gone.
            proxy_next_upstream error timeout http_502 http_504;
        }
    }
}
